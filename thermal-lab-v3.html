<!DOCTYPE html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Thermal Lab – 3D thermal & terrain visualiser</title>
<style>
html,body{margin:0;height:100%;overflow:hidden;background:#9ec5e8;font:12px system-ui,sans-serif}
canvas{display:block}
#tb{position:absolute;top:8px;left:8px;display:flex;gap:4px;z-index:3}
#tb button{background:rgba(15,20,30,.85);color:#fff;border:0;border-radius:6px;padding:5px 10px;cursor:pointer;font-size:13px}
#ui{position:absolute;top:44px;left:8px;width:292px;max-height:calc(100% - 54px);overflow:auto;background:rgba(15,20,30,.85);color:#e8eef5;padding:4px 8px;border-radius:8px;box-sizing:border-box}
#ui details{border-top:1px solid rgba(255,255,255,.12);padding:2px 0}#ui details:first-child{border:0}
#ui summary{cursor:pointer;font-weight:600;color:#ffc46b;padding:3px 0;font-size:12px}
#ui input,#ui select,#ui button{box-sizing:border-box;padding:2px 4px;font-size:11px;min-width:0}
#ui select{width:100%;margin:2px 0}.g2{display:grid;grid-template-columns:1fr 1fr;gap:4px;margin:3px 0}.g2>*{width:100%}
.sr{display:grid;grid-template-columns:80px 1fr 58px;align-items:center;gap:4px;margin:1px 0}.sr span{font-size:11px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}.sr input{width:100%;margin:0}.sr b{text-align:right;font-size:11px;font-weight:600}
#ui .ck{display:block;margin:3px 0;font-size:11px}#ui #play{width:100%;margin:4px 0}
#hlp{position:fixed;inset:0;background:rgba(0,0,0,.55);z-index:11;display:none;align-items:center;justify-content:center}#hbox{width:min(780px,94vw);max-height:90vh;background:#fff;color:#111;border-radius:8px;display:flex;flex-direction:column}
#hbox .bar{display:flex;justify-content:space-between;align-items:center;padding:8px 14px;border-bottom:1px solid #ddd;font-size:15px}#hc{overflow:auto;padding:2px 16px 14px;font-size:13px;line-height:1.45}#hc h4{margin:14px 0 4px;color:#b45309}#hc table{border-collapse:collapse;width:100%}#hc td{padding:3px 6px;vertical-align:top;border-bottom:1px solid #eee}#hc kbd{background:#eee;border:1px solid #bbb;border-radius:3px;padding:0 4px}
#hud{position:absolute;right:8px;top:8px;background:rgba(15,20,30,.82);color:#e8eef5;padding:8px 10px;border-radius:8px;white-space:pre;font:11px monospace}
#st{position:absolute;bottom:6px;left:8px;color:#123;font-size:11px}
#mapm{position:fixed;inset:0;background:rgba(0,0,0,.6);z-index:10;display:none;align-items:center;justify-content:center}#mapbox{width:min(900px,94vw);height:min(640px,90vh);background:#fff;color:#111;border-radius:8px;display:flex;flex-direction:column;overflow:hidden}#map{flex:1}#mapbox .bar{display:flex;gap:6px;padding:6px;align-items:center}#mapbox input{flex:1;padding:4px}#mapbox button{padding:5px 10px}
#leg{position:absolute;right:8px;bottom:8px;color:#fff;background:rgba(15,20,30,.82);padding:6px 8px;border-radius:8px;font-size:11px}
#leg i{display:inline-block;width:90px;height:8px;background:linear-gradient(90deg,#0066ff,#e6e6e6,#ff3300);vertical-align:middle}
</style></head><body>
<div id="tb"><button id="tg" title="Show/hide the control panel">☰</button><button id="tg2" title="Show/hide HUD and legend">📊</button><button id="hb" title="Help">? Help</button></div>
<div id="ui">
<details open><summary>📍 Location</summary>
<div class="g2"><input id="lat" value="45.3125" title="Latitude (°N, negative = south)"><input id="lon" value="5.8967" title="Longitude (°E, negative = west)"></div>
<div class="g2"><select id="sz" title="Zone size (km per side)"></select><select id="src" title="Aerial imagery source"><option value="esri">Esri imagery</option><option value="eox">Sentinel-2 (EOX)</option></select></div>
<div class="g2"><button id="map2d">📍 Pick on map</button><button id="go">Load terrain</button></div></details>
<details><summary>💾 Saved sites</summary>
<div class="g2"><input id="pn" placeholder="Site name"><div class="g2" style="margin:0"><button id="ps">Save</button><button id="pd">Delete</button></div></div><select id="pl"></select>
<div class="g2"><button id="pe">Export JSON</button><button id="pi">Import JSON</button></div><input type="file" id="pf" accept=".json,application/json" style="display:none"></details>
<div id="sl"></div>
<div id="xtra" style="display:none"><button id="play"></button><select id="mode" title="What is painted on the terrain"><option value="0">Aerial photo + sun shading</option><option value="1">Sticky surface heat pool (B / critical)</option><option value="2">Ground heat flux</option><option value="3">Albedo</option></select><label class="ck"><input type="checkbox" id="pt" checked> Show air tracers</label></div>
</div>
<div id="hlp"><div id="hbox"><div class="bar"><b>Thermal Lab – help</b><button id="hx">✕ Close</button></div><div id="hc"></div></div></div>
<div id="mapm"><div id="mapbox"><div class="bar"><input id="mq" placeholder="Search a place (OpenStreetMap / Nominatim)…"><button id="mqb">Search</button></div><div id="map"></div><div class="bar"><span id="mc" style="flex:1;font-size:12px">Click on the map to choose the centre of the zone</span><button id="mapok">Use this location</button><button id="mapx">Cancel</button></div></div></div>
<div id="hud"></div><div id="leg">tracer vertical speed: sink <i></i> lift</div><div id="st"></div>
<script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
<script>
/* ===================== CONFIG – edit freely =====================
   sliders: [id, label, min, max, default, step, group, help text]                     */
const CFG={
 N:161,                       // terrain/display grid cells per side
 maxTracers:200000,
 dayMinutes:3,                // real minutes for a full 24 h when "Play day" is running
 sizes:[2,4,6,8,16,32,64],    // selectable zone sizes (km)
 defaultSize:4,
 vorticity:.006,              // vorticity confinement (keeps eddies/shear rolls alive; 0 = off)
 sliders:[   // keep sliders of the same group next to each other
  ['wspd','Global wind',0,20,5,.5,'Wind','Speed (m/s) of the global wind blowing above the breeze altitude. It increases slightly with height.'],
  ['wdir','Global from °',0,359,270,1,'Wind','Direction the global wind comes FROM (0 = N, 90 = E, 180 = S, 270 = W).'],
  ['bstr','Breeze',0,12,3,.5,'Wind','Speed (m/s) of the valley breeze: a local, heating-driven wind imposed at the zone edges below the breeze altitude. 0 disables it.'],
  ['bdir','Breeze from °',0,359,90,1,'Wind','Direction the breeze comes FROM (typically up-valley by day). Opposing the global wind creates shear layers and turbulence where they meet.'],
  ['balt','Breeze alt. m',0,3000,600,50,'Wind','Height (m above the lowest ground of the zone) below which the breeze is imposed at the zone edges. Above it (blended over ~300 m) the global wind applies.'],
  ['month','Month',1,12,6.5,.1,'Sun & time','Month of the year (1 = Jan … 12 = Dec, fractions allowed). With the latitude it sets the sun declination, hence sun height and day length.'],
  ['hour','Solar time',0,24,13,.05,'Sun & time','Solar time of day (12:00 = sun due south in the northern hemisphere). Sun elevation/azimuth derive from month, time and latitude. Sun under the horizon = no heating.'],
  ['tscale','Sim speed ×',1,60,8,1,'Sun & time','Simulation speed multiplier (more simulated seconds per frame). Ignored while the day cycle is playing.'],
  ['clear','Clear sky',.2,1,.9,.05,'Sun & time','Clear-sky factor / ground dryness: scales sunlight and therefore ground heating (1 = clear and dry, low = hazy / damp).'],
  ['exag','Vert. exag.',1,3,1.3,.1,'Display','Vertical exaggeration of the terrain and tracers (display only).'],
  ['npart','Tracers',1000,50000,7000,1000,'Display','Number of air tracers. More gives a denser picture but is slower.'],
  ['vzmin','vz filter ≥',-3,5,-3,.1,'Display','Only tracers whose vertical speed (m/s) is above this value are drawn. Use 1–2 to show only lift; −3 shows everything.']]};
const $=id=>document.getElementById(id),N=CFG.N,MAXP=CFG.maxTracers,P={sunel:50,sunaz:180};
CFG.sliders.forEach(x=>P[x[0]]=x[4]);
const MON=['Jan','Feb','Mar','Apr','May','Jun','Jul','Aug','Sep','Oct','Nov','Dec'];
const FMT={hour:v=>{let h=Math.floor(v),m=Math.round((v-h)*60);if(m===60){h++;m=0}return String(h%24).padStart(2,'0')+':'+String(m).padStart(2,'0')},month:v=>MON[Math.min(11,Math.max(0,Math.round(v)-1))]+(v%1?' ('+v.toFixed(1)+')':'')};
const lbl=(k,v)=>(FMT[k]||(x=>x))(v);
function setQuiet(k,v){if(!(k in P)||!$(k))return;P[k]=+v;$(k).value=v;$('v_'+k).textContent=lbl(k,P[k])}
function setParam(k,v){setQuiet(k,v);onParam(k)}
const GRP={};
function grp(name){if(!GRP[name]){const d=document.createElement('details');d.open=['Wind','Sun & time'].includes(name);d.innerHTML=`<summary>${name}</summary><div></div>`;$('sl').appendChild(d);GRP[name]=d.lastChild}return GRP[name]}
CFG.sliders.forEach(([k,l,mn,mx,v,st_,g,hp])=>{const d=document.createElement('div');d.className='sr';d.title=hp||l;d.innerHTML=`<span>${l}</span><input type="range" id="${k}" min="${mn}" max="${mx}" step="${st_}" value="${v}"><b id="v_${k}">${lbl(k,v)}</b>`;grp(g||'Other').appendChild(d);d.querySelector('input').oninput=e=>setParam(k,+e.target.value)});
grp('Sun & time').appendChild($('play'));grp('Display').append($('mode'),$('pt').parentNode);
CFG.sizes.forEach(z=>{const o=document.createElement('option');o.value=z;o.textContent=z+' km';if(z===CFG.defaultSize)o.selected=true;$('sz').appendChild(o)});
const terr=(z,x,y)=>`https://s3.amazonaws.com/elevation-tiles-prod/terrarium/${z}/${x}/${y}.png`;
const SRC={esri:{max:17,url:(z,x,y)=>`https://server.arcgisonline.com/ArcGIS/rest/services/World_Imagery/MapServer/tile/${z}/${y}/${x}`},
 eox:{max:13,url:(z,x,y)=>`https://tiles.maps.eox.at/wmts/1.0.0/s2cloudless-2021_3857/default/g/${z}/${y}/${x}.jpg`}};
const st=t=>$('st').textContent=t;

// ---------- three.js setup ----------
const R=new THREE.WebGLRenderer({antialias:true});R.setSize(innerWidth,innerHeight);R.setPixelRatio(devicePixelRatio);document.body.prepend(R.domElement);
const scene=new THREE.Scene();scene.background=new THREE.Color(0x9ec5e8);
const cam=new THREE.PerspectiveCamera(50,innerWidth/innerHeight,20,800000);
const O={t:new THREE.Vector3(),d:5000,th:.6,ph:1.0};
function updCam(){cam.position.set(O.t.x+O.d*Math.sin(O.ph)*Math.sin(O.th),O.t.y+O.d*Math.cos(O.ph),O.t.z+O.d*Math.sin(O.ph)*Math.cos(O.th));cam.lookAt(O.t)}
addEventListener('resize',()=>{R.setSize(innerWidth,innerHeight);cam.aspect=innerWidth/innerHeight;cam.updateProjectionMatrix()});
let drag=null;const cv=R.domElement;
cv.oncontextmenu=e=>e.preventDefault();
cv.onpointerdown=e=>{drag={x:e.clientX,y:e.clientY,pan:e.button>0||e.shiftKey};cv.setPointerCapture(e.pointerId)};
cv.onpointerup=()=>drag=null;
cv.onpointermove=e=>{if(!drag)return;const dx=e.clientX-drag.x,dy=e.clientY-drag.y;drag.x=e.clientX;drag.y=e.clientY;
 if(drag.pan){const k=O.d*.0012,fx=-Math.sin(O.th),fz=-Math.cos(O.th),rx=Math.cos(O.th),rz=-Math.sin(O.th);O.t.x+=fx*dy*k-rx*dx*k;O.t.z+=fz*dy*k-rz*dx*k}
 else{O.th-=dx*.006;O.ph=Math.min(1.55,Math.max(.05,O.ph-dy*.006))}};
cv.onwheel=e=>{e.preventDefault();O.d=Math.min(500000,Math.max(100,O.d*Math.exp(e.deltaY*.001)))};
const sunM=new THREE.Mesh(new THREE.SphereGeometry(1,16,12),new THREE.MeshBasicMaterial({color:0xffdd44}));scene.add(sunM);
const arrow=new THREE.ArrowHelper(new THREE.Vector3(1,0,0),new THREE.Vector3(),500,0x1144ff,100,60);scene.add(arrow);const arrow2=new THREE.ArrowHelper(new THREE.Vector3(1,0,0),new THREE.Vector3(),500,0x00aa55,100,60);scene.add(arrow2);
const pg=new THREE.BufferGeometry(),ppos=new Float32Array(MAXP*3),pcol=new Float32Array(MAXP*3);
pg.setAttribute('position',new THREE.BufferAttribute(ppos,3));pg.setAttribute('color',new THREE.BufferAttribute(pcol,3));
const pts=new THREE.Points(pg,new THREE.PointsMaterial({size:3,sizeAttenuation:false,vertexColors:true,transparent:true,opacity:.85,depthWrite:false}));pts.frustumCulled=false;scene.add(pts);
const tc=document.createElement('canvas');tc.width=tc.height=1024;const tx=tc.getContext('2d');const tex=new THREE.CanvasTexture(tc);tex.anisotropy=8;
let mesh=null,G=null;

// ---------- data loading ----------
async function mosaic(urlFn,z,lat,lon,half){
 const n=256*2**z,a=lat*Math.PI/180,px=(lon+180)/360*n,py=(1-Math.log(Math.tan(a)+1/Math.cos(a))/Math.PI)/2*n,hp=half/(156543.03*Math.cos(a)/2**z);
 const x0=px-hp,y0=py-hp,tx0=Math.floor(x0/256),ty0=Math.floor(y0/256),tx1=Math.floor((px+hp)/256),ty1=Math.floor((py+hp)/256);
 const c=document.createElement('canvas');c.width=(tx1-tx0+1)*256;c.height=(ty1-ty0+1)*256;const g=c.getContext('2d',{willReadFrequently:true});
 let ok=0;const jobs=[];
 for(let ty=ty0;ty<=ty1;ty++)for(let tx=tx0;tx<=tx1;tx++)jobs.push(new Promise(r=>{const im=new Image();im.crossOrigin='anonymous';im.onload=()=>{g.drawImage(im,(tx-tx0)*256,(ty-ty0)*256);ok++;r()};im.onerror=r;im.src=urlFn(z,tx,ty)}));
 await Promise.all(jobs);return{c,g,ox:x0-tx0*256,oy:y0-ty0*256,w:2*hp,ok,tot:jobs.length};
}
async function load(){
 const lat=+$('lat').value,lon=+$('lon').value,size=+$('sz').value,half=size*500,cell=size*1000/(N-1),co=Math.cos(lat*Math.PI/180),src=SRC[$('src').value];
 const ze=Math.min(14,Math.max(8,Math.ceil(Math.log2(156543*co/cell))));let zi=Math.min(src.max,ze+2);
 const cnt=z=>(Math.ceil(2*half/(156543*co/2**z)/256)+1)**2;while(zi>8&&cnt(zi)>30)zi--;
 st('Downloading elevation + imagery tiles…');
 const [E,I]=await Promise.all([mosaic(terr,ze,lat,lon,half),mosaic(src.url,zi,lat,lon,half)]);
 const h=new Float32Array(N*N);
 if(E.ok===E.tot){
  const W=E.c.width,d=E.g.getImageData(0,0,W,E.c.height).data,e=(x,y)=>{const o=(y*W+x)*4;return d[o]*256+d[o+1]+d[o+2]/256-32768};
  for(let j=0;j<N;j++)for(let i=0;i<N;i++){const fx=Math.min(W-2,E.ox+i/(N-1)*E.w),fy=Math.min(E.c.height-2,E.oy+j/(N-1)*E.w),x=fx|0,y=fy|0,u=fx-x,v=fy-y;
   h[j*N+i]=(e(x,y)*(1-u)+e(x+1,y)*u)*(1-v)+(e(x,y+1)*(1-u)+e(x+1,y+1)*u)*v}
  st('Elevation OK ('+E.tot+' tiles, z'+ze+'). Imagery '+I.ok+'/'+I.tot+' tiles z'+zi+'.');
 }else{for(let j=0;j<N;j++)for(let i=0;i<N;i++)h[j*N+i]=900+250*Math.sin(i/22)*Math.cos(j/30)+400*Math.exp(-((i-110)**2+(j-60)**2)/1500);
  st('⚠ Elevation download failed (offline / blocked?) – showing synthetic terrain.');}
 const ic=document.createElement('canvas');ic.width=ic.height=1024;const ig=ic.getContext('2d');ig.fillStyle='#777';ig.fillRect(0,0,1024,1024);
 if(I.ok)ig.drawImage(I.c,I.ox,I.oy,I.w,I.w,0,0,1024,1024);
 const sc=document.createElement('canvas');sc.width=sc.height=N;const sg=sc.getContext('2d');sg.drawImage(ic,0,0,N,N);
 let px;try{px=sg.getImageData(0,0,N,N).data}catch(e){px=new Uint8ClampedArray(N*N*4).fill(120);st('Imagery canvas tainted: default albedo used.')}
 const alb=new Float32Array(N*N),fs=new Float32Array(N*N);
 for(let k=0;k<N*N;k++){const r=px[k*4],g=px[k*4+1],b=px[k*4+2],L=(.3*r+.59*g+.11*b)/255;
  const veg=g>r*1.03&&g>b*1.05,wat=b>r&&b>g*.95&&L<.35;
  alb[k]=wat?.06:Math.min(.8,Math.max(.05,.04+.5*Math.pow(L,1.3)));
  fs[k]=wat?.03:veg?.30:.55}   // fraction of net radiation going to sensible heat
 const gx=new Float32Array(N*N),gz=new Float32Array(N*N);
 for(let j=0;j<N;j++)for(let i=0;i<N;i++){const a=Math.max(0,i-1),b=Math.min(N-1,i+1),c=Math.max(0,j-1),d=Math.min(N-1,j+1);
  gx[j*N+i]=(h[j*N+b]-h[j*N+a])/((b-a)*cell);gz[j*N+i]=(h[d*N+i]-h[c*N+i])/((d-c)*cell)}
 G={N,size,lat,S:size*1000,cell,h,alb,fs,gx,gz,H:new Float32Array(N*N),Hs:new Float32Array(N*N),L:new Float32Array(N*N),cum:new Float32Array(N*N),ic,ac:albCanvas(alb),zi:0,Hm:1,Hmax:1};
 if(mesh){scene.remove(mesh);mesh.geometry.dispose()}
 const geo=new THREE.PlaneGeometry(size*1000,size*1000,N-1,N-1);geo.rotateX(-Math.PI/2);
 const pa=geo.attributes.position;for(let k=0;k<N*N;k++)pa.setY(k,h[k]);geo.computeVertexNormals();
 mesh=new THREE.Mesh(geo,new THREE.MeshBasicMaterial({map:tex}));mesh.scale.y=P.exag;scene.add(mesh);
 let m=0;for(const v of h)m+=v;m/=h.length;G.mean=m;O.t.set(0,m*P.exag,0);O.d=size*1000*.9;
 sunPos();compute();st('Spinning up 3D wind field…');await new Promise(r=>setTimeout(r,40));initSolver();for(let p=0;p<MAXP;p++)spawn(p,true);placeMarkers();redraw();st('Ready.');
}
function albCanvas(a){const c=document.createElement('canvas');c.width=c.height=N;const g=c.getContext('2d'),d=g.createImageData(N,N);
 for(let k=0;k<N*N;k++){const v=Math.min(255,a[k]*400);d.data.set([v,v,v,255],k*4)}g.putImageData(d,0,0);return c}

// ---------- 3D flow solver (coarse CFD: advection + pressure projection on voxel terrain) ----------
const NX=40,NZ=24,NXY=NX*NX,NC=NXY*NZ,F=()=>new Float32Array(NC);
const U=F(),V=F(),W=F(),T=F(),Pp=F(),Dv=F(),U2=F(),V2=F(),W2=F(),T2=F(),S=new Uint8Array(NC),low=new Int32Array(NXY),hcol=new Float32Array(NXY);
let zmin,ztop,dx,dz,maxW=0,ixs=new Int32Array(8),wts=new Float32Array(8);
let amu=0,amv=0;
function ambient(z){   // valley breeze below the breeze altitude, global wind above (smooth blend over ~300 m); heights above lowest ground
 const hh=z-zmin,f0=(hh-P.balt)/300+.5,f=f0<0?0:f0>1?1:f0*f0*(3-2*f0),pw=Math.min(1.4,Math.pow(Math.max(10,hh)/500,.14)),gd=P.wdir*Math.PI/180,bd=P.bdir*Math.PI/180;
 amu=-P.bstr*Math.sin(bd)*(1-f)-P.wspd*Math.sin(gd)*pw*f;amv=P.bstr*Math.cos(bd)*(1-f)+P.wspd*Math.cos(gd)*pw*f}
const envT=z=>Math.max(0,z-(G.mean+G.zi))*.006;   // stable layer (inversion) above the convective boundary layer top
function initSolver(){
 const Sm=G.S;dx=Sm/NX;let mn=1e9,mx=-1e9;for(const v of G.h){mn=Math.min(mn,v);mx=Math.max(mx,v)}
 zmin=mn-30;ztop=Math.max(mx,G.mean+1850)+500;dz=(ztop-zmin)/NZ;
 for(let j=0;j<NX;j++)for(let i=0;i<NX;i++){const c=j*NX+i;hcol[c]=bil(G.h,((i+.5)/NX-.5)*Sm,((j+.5)/NX-.5)*Sm);let k=0;while(k<NZ-1&&zmin+(k+.5)*dz<hcol[c])k++;low[c]=k;for(let q=0;q<NZ;q++)S[q*NXY+c]=q<k?1:0}
 Pp.fill(0);W.fill(0);
 for(let k=0;k<NZ;k++){const z=zmin+(k+.5)*dz;for(let c=0;c<NXY;c++){const id=k*NXY+c;ambient(z);U[id]=S[id]?0:amu;V[id]=S[id]?0:amv;T[id]=envT(z)}}
 for(let s=0;s<25;s++){project(30);}
 G.pc=new Int32Array(N*N);for(let j=0;j<N;j++)for(let i=0;i<N;i++)G.pc[j*N+i]=((j*NX/N)|0)*NX+((i*NX/N)|0);
 G.B=new Float32Array(N*N);G.B2=new Float32Array(N*N);G.Bc=new Float32Array(N*N).fill(100);G.rnd=new Float32Array(N*N).map(()=>.8+Math.random()*.4);
 G.cvx=(()=>{const b=blur(G.h,4),o=new Float32Array(N*N);for(let k=0;k<N*N;k++)o[k]=Math.min(1,Math.max(0,(G.h[k]-b[k])/30));return o})();
 const n2=N*N;G.sl=new Float32Array(n2);G.ux0=new Float32Array(n2);G.uz0=new Float32Array(n2);G.bc0=new Float32Array(n2);
 for(let k=0;k<n2;k++){const sl=Math.sqrt(G.gx[k]**2+G.gz[k]**2),st=Math.min(1,Math.max(0,(sl-.08)/.37));G.sl[k]=sl;if(sl>1e-4){G.ux0[k]=G.gx[k]/sl;G.uz0[k]=G.gz[k]/sl}
  G.bc0[k]=120*(.75+1.6*st)*(1-.6*G.cvx[k])*G.rnd[k]}
 for(let k=0;k<n2;k++)G.B[k]=G.H[k]>0?Math.random()*70:0}
const OFF=[0,1,NX,NX+1,NXY,NXY+1,NXY+NX,NXY+NX+1],cl=(v,m)=>v<0?0:v>m?m:v;
function advect(dt){

 $('mc').textContent=la.toFixed(4)+', '+lo.toFixed(4)+'  —  zone '+$('sz').value+' km'}
$('map2d').onclick=async()=>{$('mapm').style.display='flex';try{await loadLeaflet()}catch(e){$('mapm').style.display='none';return st('Could not load the map library (offline?)')}
 const la=+$('lat').value,lo=+$('lon').value;
 if(!lmap){lmap=L.map('map').setView([la,lo],11);L.tileLayer('https://tile.openstreetmap.org/{z}/{x}/{y}.png',{maxZoom:18,attribution:'© OpenStreetMap contributors'}).addTo(lmap);lmap.on('click',e=>pick(e.latlng.lat,e.latlng.lng))}else lmap.setView([la,lo]);
 setTimeout(()=>{lmap.invalidateSize();if(lrect){lmap.removeLayer(lrect);lrect=null}pick(la,lo)},60)};

let hudT=0,rdT=0,playing=false,lastT=performance.now(),lastSun=0,sunDirty=false;
function advanceDay(rd){const h=(P.hour+rd*24/(CFG.dayMinutes*60))%24;P.hour=h;$('hour').value=h;$('v_hour').textContent=lbl('hour',h);sunPos();sunDirty=true}
const playLbl=()=>$('play').textContent=playing?'⏸ Pause day cycle':'▶ Play full day in '+CFG.dayMinutes+' min';
$('play').onclick=()=>{playing=!playing;playLbl()};playLbl();
function loop(now){requestAnimationFrame(loop);
 if(G&&S.length){const rd=Math.min(.1,(now-lastT)/1000);lastT=now;let dt=.3*P.tscale*Math.min(3,Math.sqrt(G.size/4));if(playing){dt=Math.min(30,86400/(CFG.dayMinutes*60)*rd);advanceDay(rd)}   // while playing, simulated time follows the sun clock
  if(sunDirty&&now-lastSun>400){sunDirty=false;lastSun=now;compute();placeMarkers()}
  solve(dt,6);step(dt);paint();hudT+=1;rdT+=1;
  if(hudT>12){hudT=0;maxW=0;let up=0;for(let i=0;i<NC;i++){const a=i%NX,b=(i%NXY/NX)|0,c=i/NXY|0;if(!S[i]&&W[i]>maxW&&Math.min(a,NX-1-a,b,NX-1-b,NZ-1-c)>=3)maxW=W[i]}let tot=0,ct=0;for(let i=0;i<N*N;i++)if(G.H[i]>0){tot+=Math.min(1,G.B[i]/G.Bc[i]);ct++}
   $('hud').textContent=`Mean sensible heat flux: ${G.Hm.toFixed(0)} W/m²\nPeak ground flux:   ${G.Hmax.toFixed(0)} W/m²\nBoundary layer top: ${G.zi.toFixed(0)} m AGL\nStrongest lift now: ${maxW.toFixed(1)} m/s\nSurface heat stored: ${ct?(100*tot/ct).toFixed(0):0}% of release threshold\nGlobal wind: ${P.wspd} m/s from ${P.wdir}°\nBreeze: ${P.bstr} m/s from ${P.bdir}° below ${P.balt} m\nSun: ${P.sunel.toFixed(0)}° elev, az ${P.sunaz.toFixed(0)}°  (${lbl('hour',P.hour)}, ${lbl('month',P.month)})`}
  if(rdT>20&&$('mode').value==='1'){rdT=0;redraw()}}
 updCam();R.render(scene,cam)}
requestAnimationFrame(loop);updCam();
// ---- help popup + UI toggles ----
function buildHelp(){
 const rows=CFG.sliders.map(([k,l,mn,mx,v,st_,g,hp])=>`<tr><td><b>${l}</b><br><small>${g||''}</small></td><td>${mn} … ${mx}<br><small>step ${st_}</small></td><td>${hp||''}</td></tr>`).join('');
 $('hc').innerHTML=`
<h4>Moving the camera</h4><table>
<tr><td><b>Left-drag</b></td><td>Rotate around the point you look at (orbit).</td></tr>
<tr><td><b>Right-drag</b> / <b>middle-drag</b> / <kbd>Shift</kbd> + left-drag</td><td>Pan (translate) across the terrain.</td></tr>
<tr><td><b>Mouse wheel</b></td><td>Zoom in/out (limits: 100 m to 500 km from the target).</td></tr>
<tr><td><b>One finger</b> (touch)</td><td>Rotate. There is no pinch-zoom or two-finger pan yet.</td></tr>
<tr><td><kbd>H</kbd></td><td>Hide / show the whole interface (panel, HUD, legend). <kbd>Esc</kbd> closes dialogs. <kbd>?</kbd> opens this help.</td></tr>
<tr><td><b>☰ / 📊 buttons</b></td><td>Show/hide the control panel / the HUD and legend only.</td></tr></table>
<h4>Panel</h4><table>
<tr><td><b>📍 Location</b></td><td>Latitude / longitude of the zone centre, zone size (km per side) and aerial imagery source. <b>Load terrain</b> downloads open elevation (AWS Terrain Tiles) and imagery tiles. <b>Pick on map</b> opens an OpenStreetMap view: search or click to set the centre; the orange rectangle is the zone.</td></tr>
<tr><td><b>💾 Saved sites</b></td><td><b>Save</b> stores the location <i>and every slider/option and the camera view</i> under a name (in this browser). <b>Export JSON</b> writes all sites to <code>sites.json</code>; <b>Import JSON</b> reads one back. A <code>sites.json</code> next to the page is loaded automatically when the page is served over http(s) (★ = from file); the optional key <code>"default"</code> names the site opened at start.</td></tr>
<tr><td><b>▶ Play full day</b></td><td>Runs the sun through 24 h in ${CFG.dayMinutes} min (<code>CFG.dayMinutes</code>); the simulated clock follows, so thermals build up and fade during the day.</td></tr>
<tr><td><b>Display mode</b></td><td>Photo with sun shading · <b>Sticky heat pool</b> (how close each ground cell is to releasing a thermal: hot colours = about to detach) · Ground heat flux · Albedo (estimated from the photo).</td></tr></table>
<h4>Sliders</h4><table>${rows}</table><p><small>Hover a slider for its description. Ranges and defaults are in the <code>CFG</code> block at the top of the script.</small></p>
<h4>Reading the picture</h4><ul>
<li><b>Tracer colours:</b> blue = sinking air, grey/white ≈ still, red = rising air (vertical speed from about −2 to +4 m/s).</li>
<li><b>Arrows:</b> blue = global wind, green = valley breeze; the yellow sphere is the sun.</li>
<li><b>HUD:</b> mean/peak ground heat flux, boundary-layer top, strongest lift, share of stored heat vs. release threshold.</li></ul>
<h4>How the model works (and its limits)</h4><ul>
<li>A coarse 3D flow solver (about 100 m cells for a 4 km zone) pushes the wind around and over the terrain; breeze and global wind are imposed at the zone edges, where they meet they create shear and eddies.</li>
<li>Sun angle, slope, cast shadows, albedo and land cover (water / vegetation / bare) give each ground cell a heat flux.</li>
<li>Heat first <b>sticks</b> to the ground in a thin layer that creeps along the wind and up slopes. When it exceeds a threshold (low on flat ground, crests, in wind; high on steep slopes) it detaches as a warm bubble that rises under buoyancy until the inversion above the boundary layer stops it.</li>
<li>Educational tool only: not calibrated, no humidity/clouds, coarse terrain; <b>never use it for flight planning</b>.</li></ul>`}
buildHelp();

 else if(e.key==='Escape'){$('hlp').style.display='none';$('mapm').style.display='none'}});
